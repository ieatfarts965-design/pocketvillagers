
name: Build VillagerPocket

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build plugin
        working-directory: VillagerPocket-GitHub-Build
        run: chmod +x gradlew && ./gradlew build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VillagerPocket-JAR
          path: VillagerPocket-GitHub-Build/build/libs/*.jar
