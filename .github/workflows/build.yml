
name: Build VillagerPocket

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build plugin
        working-directory: VillagerPocket-GitHub-Build (1)
        run: gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VillagerPocket-JAR
          path: VillagerPocket-GitHub-Build (1)/build/libs/*.jar
